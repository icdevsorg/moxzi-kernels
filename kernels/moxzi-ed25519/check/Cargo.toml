# Native differential checks for ../rust/src/ops.rs (not part of the kernel build):
#   cargo test --release --manifest-path kernels/moxzi-ed25519/check/Cargo.toml
# and once more with the kernel's backend:
#   RUSTFLAGS='--cfg curve25519_dalek_bits="32"' cargo test --release --manifest-path ...
[package]
name = "moxzi-ed25519-check"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "check.rs"

[dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast", "hazmat"] }
curve25519-dalek = { version = "=4.1.3", default-features = false, features = ["precomputed-tables"] }
sha2 = { version = "=0.10.9", default-features = false }

[workspace]
