[package]
name = "moxzi-secp256k1"
version = "0.1.0"
description = "secp256k1 keys, point arithmetic, RFC 6979 ECDSA and BIP340 Schnorr, with a native moxzi kernel; the Motoko bodies run under moc or without the opt-in."
repository = "https://github.com/icdevsorg/moxzi-kernels"
license = "MIT OR Apache-2.0"
files = ["src/**/*.mo", "kernel/*.kernel.toml"]

[dependencies]
core = "2.6.0"
sha2 = "0.1.14"
ecdsa = "8.0.1"
bitcoin = "0.2.1"

[kernel]
abi = 1
file = "kernel/moxzi-secp256k1.kernel.toml"
source = "https://github.com/icdevsorg/moxzi-kernels/tree/main/kernels/moxzi-secp256k1/rust"

[kernel.functions]
"Secp256k1.publicKey" = { export = "public_key", args = ["Blob"], result = "Blob", result_bytes = 65 }
"Secp256k1.derivePublicKey" = { export = "derive_public_key", args = ["Blob"], result = "Blob", result_bytes = 33 }
"Secp256k1.compressPublicKey" = { export = "compress_public_key", args = ["Blob"], result = "Blob", result_bytes = 33 }
"Secp256k1.decompressPublicKey" = { export = "decompress_public_key", args = ["Blob"], result = "Blob", result_bytes = 65 }
"Secp256k1.convertPublicKey" = { export = "convert_public_key", args = ["Blob", "Bool"], result = "Blob" }
"Secp256k1.xOnlyPublicKey" = { export = "x_only_public_key", args = ["Blob"], result = "Blob", result_bytes = 32 }
"Secp256k1.pointAdd" = { export = "point_add", args = ["Blob", "Blob"], result = "?Blob" }
"Secp256k1.pointMultiply" = { export = "point_multiply", args = ["Blob", "Blob"], result = "?Blob" }
"Secp256k1.baseMultiply" = { export = "base_multiply", args = ["Blob"], result = "?Blob" }
"Secp256k1.tweakPublicKey" = { export = "tweak_public_key", args = ["Blob", "Blob"], result = "?Blob" }
"Secp256k1.tweakXOnlyPublicKey" = { export = "tweak_x_only_public_key", args = ["Blob", "Blob"], result = "?Blob" }
"Secp256k1.tweakXOnlySecretKey" = { export = "tweak_x_only_secret_key", args = ["Blob", "Blob"], result = "?Blob" }
"Secp256k1.normalizeSignature" = { export = "normalize_signature", args = ["Blob"], result = "Blob", result_bytes = 64 }
"Secp256k1.signatureFromDer" = { export = "signature_from_der", args = ["Blob"], result = "?Blob" }
"Secp256k1.signatureToDer" = { export = "signature_to_der", args = ["Blob"], result = "Blob" }
"Secp256k1.signPrehash" = { export = "sign_prehash", args = ["Blob", "Blob"], result = "Blob", result_bytes = 64 }
"Secp256k1.verifyPrehash" = { export = "verify_prehash", args = ["Blob", "Blob", "Blob"], result = "Bool" }
"Secp256k1.schnorrSign" = { export = "schnorr_sign", args = ["Blob", "Blob", "Blob"], result = "Blob", result_bytes = 64 }
"Secp256k1.schnorrVerify" = { export = "schnorr_verify", args = ["Blob", "Blob", "Blob"], result = "Bool" }
