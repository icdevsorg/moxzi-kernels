[package]
name = "moxzi-base58"
version = "0.1.0"
description = "Base58 and Base58Check (Bitcoin alphabet), with a native moxzi kernel; the Motoko bodies (mo:bitcoin) run under moc or without the opt-in."
repository = "https://github.com/icdevsorg/moxzi-kernels"
license = "MIT OR Apache-2.0"
files = ["src/**/*.mo", "kernel/*.kernel.toml"]

[dependencies]
core = "2.6.0"
sha2 = "0.1.14"
bitcoin = "0.2.1"

[kernel]
abi = 1
file = "kernel/moxzi-base58.kernel.toml"
source = "https://github.com/icdevsorg/moxzi-kernels/tree/main/kernels/moxzi-base58/rust"
commit = "445b558869a5552956229d704011c40480e1854c"

[kernel.functions]
"Base58.encode" = { export = "base58_encode", args = ["Blob"], result = "Text" }
"Base58.decode" = { export = "base58_decode", args = ["Text"], result = "?Blob" }
"Base58Check.encode" = { export = "base58check_encode", args = ["Blob"], result = "Text" }
"Base58Check.decode" = { export = "base58check_decode", args = ["Text"], result = "?Blob" }
