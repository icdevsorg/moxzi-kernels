[package]
name = "moxzi-base58-kernel"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["staticlib"]

[dependencies]
moxzi-kernel = { path = "../../moxzi-kernel" }
# `alloc` without `std`; `check` adds Base58Check (double SHA-256 from RustCrypto's sha2).
bs58 = { version = "=0.5.1", default-features = false, features = ["alloc", "check"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
