[package]
name = "moxzi-hash-kernel"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["staticlib"]

[dependencies]
moxzi-kernel = { path = "../../moxzi-kernel" }
sha2 = { version = "=0.10.9", default-features = false }
hmac = { version = "=0.12.1", default-features = false }
ripemd = { version = "=0.1.3", default-features = false }
# Portable implementation only (no SIMD, no C): `default-features = false` drops `std`.
blake3 = { version = "=1.5.4", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
