[package]
name = "moxzi-rsa"
version = "0.1.0"
description = "RSA-3072 RSASSA-PSS (SHA-256, PS256) for Motoko with a native moxzi kernel: verify in Motoko or natively, sign natively."
repository = "https://github.com/icdevsorg/moxzi-kernels"
license = "MIT OR Apache-2.0"
files = ["src/**/*.mo", "kernel/*.kernel.toml"]

[dependencies]
core = "2.6.0"
sha2 = "0.1.14"

[kernel]
abi = 1
file = "kernel/moxzi-rsa.kernel.toml"
source = "https://github.com/icdevsorg/moxzi-kernels/tree/main/kernels/moxzi-rsa/rust"

[kernel.functions]
"Rsa3072.verify" = { export = "rsa_pss_verify", args = ["Blob", "Blob", "Blob", "Blob"], result = "Bool" }
"Rsa3072.verifyDigest" = { export = "rsa_pss_verify_digest", args = ["Blob", "Blob", "Blob", "Blob"], result = "Bool" }
"Rsa3072.sign" = { export = "rsa_pss_sign", args = ["Blob", "Blob", "Blob"], result = "Blob", result_bytes = 384 }
