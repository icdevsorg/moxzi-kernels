[package]
name = "moxzi-p256"
version = "0.1.0"
description = "NIST P-256 (secp256r1) keys and RFC 6979 ECDSA, with a native moxzi kernel; the Motoko bodies run under moc or without the opt-in."
repository = "https://github.com/icdevsorg/moxzi-kernels"
license = "MIT OR Apache-2.0"
files = ["src/**/*.mo", "kernel/*.kernel.toml"]

[dependencies]
core = "2.6.0"
sha2 = "0.1.14"
ecdsa = "8.0.1"

[kernel]
abi = 1
file = "kernel/moxzi-p256.kernel.toml"
source = "https://github.com/icdevsorg/moxzi-kernels/tree/main/kernels/moxzi-p256/rust"

[kernel.functions]
"P256.publicKey" = { export = "public_key", args = ["Blob", "Bool"], result = "Blob" }
"P256.derivePublicKey" = { export = "derive_public_key", args = ["Blob"], result = "Blob", result_bytes = 33 }
"P256.convertPublicKey" = { export = "convert_public_key", args = ["Blob", "Bool"], result = "Blob" }
"P256.normalizeSignature" = { export = "normalize_signature", args = ["Blob"], result = "Blob", result_bytes = 64 }
"P256.signatureFromDer" = { export = "signature_from_der", args = ["Blob"], result = "?Blob" }
"P256.signatureToDer" = { export = "signature_to_der", args = ["Blob"], result = "Blob" }
"P256.signPrehash" = { export = "sign_prehash", args = ["Blob", "Blob"], result = "Blob", result_bytes = 64 }
"P256.verifyPrehash" = { export = "verify_prehash", args = ["Blob", "Blob", "Blob"], result = "Bool" }
